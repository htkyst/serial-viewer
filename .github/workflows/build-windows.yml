name: Build Windows

on:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: windows-latest

        steps:
            - name : Checkout
              uses: actions/checkout@v4
            
            - name: Build
              run: 
                npm install
                npm run tauri build

            - name: Create ZIP
              run: |
                mkdir package
                copy src-tauri\target\release\serial-viewer.exe package\serial-viewer.exe
                Compress-Archive -Path package\* -DestinationPath serial-viewer.zip
            
            - name: Upload ZIP
              uses: actions/upload-artifact@v4
              with:
                name: serial-viewer-windows-x86_64
                path: serial-viewer-windows-x86_64.zip